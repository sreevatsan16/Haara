<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haara – your neighbourhood, together</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#0E2B2A;--mut:#5B726F;--teal:#12514D;--sun:#F2A93B;--coral:#E4572E;--line:#D5E0DC;--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B1A;--card:#142A28;--ink:#EAF4F1;--mut:#9DB8B3;--line:#25423F;--teal:#4FB3A9}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.45 Nunito,system-ui,sans-serif;display:flex;justify-content:center}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.1}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative}
.scr{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.logo{font:800 34px 'Bricolage Grotesque',sans-serif;color:var(--teal);letter-spacing:-1px}
.logo i{font-style:normal;color:var(--sun)}
.sub{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 18px;font-weight:700;color:#fff;background:var(--teal)}
button.alt{background:transparent;color:var(--teal);border:2px solid var(--teal)}
button.sun{background:var(--sun);color:#2a1a00}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
label{font-weight:700;display:block;margin-bottom:6px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;border:1px solid var(--line)}
.qr{width:220px;height:220px;margin:8px auto;border-radius:22px;background:var(--card);border:2px dashed var(--teal);display:grid;place-items:center;position:relative;overflow:hidden}
.qr svg{width:130px;opacity:.9}
.qr::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--coral);animation:scan 2s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:92%}}
@media (prefers-reduced-motion:reduce){.qr::after{animation:none;top:50%}}
.age{display:flex;align-items:center;gap:16px;text-align:left;padding:20px;font-size:1.15em;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.age b{font:800 1.2em 'Bricolage Grotesque'}.age span.e{font-size:2em}
.age small{display:block;font-weight:600;color:var(--mut)}
header{padding:14px 20px;background:var(--teal);color:#fff;display:flex;justify-content:space-between;align-items:center}
header h2{font-size:1.25em}header small{opacity:.85}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 4px;font-size:.8em}
nav button.on{color:var(--teal);box-shadow:inset 0 3px 0 var(--sun)}
nav button span{display:block;font-size:1.5em}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 4px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:18px 18px 18px 4px;background:var(--card);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--teal);color:#fff;border-radius:18px 18px 4px 18px}
.m small{display:block;font-weight:700;color:var(--mut);font-size:.75em}.m.me small{color:#cfe}
.bar{display:flex;gap:8px;padding:10px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:.75em;padding:3px 10px;border-radius:99px;background:var(--sun);color:#2a1a00;font-weight:700}
.chip.g{background:var(--line);color:var(--ink)}
.list{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;text-align:center}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#1d6b65,#0B3330 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;transition:opacity .6s,visibility .6s}
#splash.off{opacity:0;visibility:hidden}
.qt{border-left:3px solid var(--sun);padding:2px 8px;margin-bottom:4px;font-size:.8em;opacity:.85;background:rgba(0,0,0,.1);border-radius:6px}
.mr{display:flex;gap:8px;align-items:flex-end}.mr.me{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.rx{display:block;background:none;color:inherit;padding:2px 0 0;font-size:.8em;border-radius:8px;opacity:.85}.m .rx{margin-top:2px}
#splash svg{width:150px;height:150px;overflow:visible}
.ring{transform-origin:60px 60px;animation:spin 7s linear infinite}
.dot{fill:#F2A93B;transform-box:fill-box;transform-origin:center;animation:pop 1.3s ease-in-out infinite}
.ln{stroke:#F2A93B;stroke-width:1.5;stroke-dasharray:60;stroke-dashoffset:60;opacity:.6;animation:draw 1.2s .3s forwards}
.hs{fill:#fff;animation:rise .8s .2s both}
.sl{display:flex;font:800 54px 'Bricolage Grotesque',sans-serif;letter-spacing:-2px}
.sl span{display:inline-block;opacity:0;transform:translateY(-34px);animation:drop .6s forwards}
#splash p{opacity:0;margin:0;animation:fade .8s 1.5s forwards}
.pb{width:170px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#F2A93B;animation:fill 2.7s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:.9}}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.big{--fs:20px}
</style></head><body>
<div id="app"></div>
<div id="splash" aria-label="Loading Haara" role="status">
<svg viewBox="0 0 120 120" aria-hidden="true"><g class="ring"><line class="ln" x1="60" y1="60" x2="104" y2="60"/><line class="ln" x1="60" y1="60" x2="82" y2="98"/><line class="ln" x1="60" y1="60" x2="38" y2="98"/><line class="ln" x1="60" y1="60" x2="16" y2="60"/><line class="ln" x1="60" y1="60" x2="38" y2="22"/><line class="ln" x1="60" y1="60" x2="82" y2="22"/><circle class="dot" cx="104" cy="60" r="5"/><circle class="dot" style="animation-delay:.2s" cx="82" cy="98" r="5"/><circle class="dot" style="animation-delay:.4s" cx="38" cy="98" r="5"/><circle class="dot" style="animation-delay:.6s" cx="16" cy="60" r="5"/><circle class="dot" style="animation-delay:.8s" cx="38" cy="22" r="5"/><circle class="dot" style="animation-delay:1s" cx="82" cy="22" r="5"/></g><path class="hs" d="M60 38 L80 56 H74 V78 H46 V56 H40 Z"/><rect x="55" y="62" width="10" height="16" rx="2" fill="#12514D"/></svg>
<div class="sl" aria-hidden="true"><span style="animation-delay:.4s">H</span><span style="animation-delay:.52s">a</span><span style="animation-delay:.64s">a</span><span style="animation-delay:.76s;color:#F2A93B">r</span><span style="animation-delay:.88s">a</span></div>
<p>Your neighbourhood, together</p>
<div class="pb"><i></i></div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(!s)return;s.classList.add('off');setTimeout(function(){s.remove()},700)},3000)</script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const S={pm:{on:true,blocked:{},open:null,reqs:[{from:'Priya Sharma',to:'@me',st:'pending',note:'Hi! Could I borrow your ladder this weekend?',msgs:[]},{from:'Mariam',to:'@me',st:'accepted',note:'',msgs:[{f:'Mariam',t:'Thanks for yesterday! 💛',time:'08:30'}]}]},pmv:false,prof:null,pe:false,pf:{},photos:{},hc:{},mp:{mode:'map',tick:0,psel:null,sv:{iso:{z:.32,ox:0,oy:10}},z:1,ox:0,oy:0,r:0,sel:null,hits:[],st:{x:9.5,y:5.5,h:Math.PI/2}},gx:{},gm:null,rep2:null,dm:[{me:0,t:'Hi! I am your community admin. Write here for questions, problems or ideas.',time:''}],inbox:[{n:'Mariam',t:'Can we add a recycling reminder to the chat?',time:'09:12',r:''}],ai:[{r:'bot',t:'Hi, I am Aislin 👋 Your community helper. Ask me how to use Haara, get help writing a message, or ask for everyday tips.'}],busy:false,f:'All',c:'General',admin:false,creator:false,why:'',note:'',rep:null,reps:[{by:'Mariam',who:'Omar',why:'Spam',note:'Posting ads in the chat',st:'open'}],codes:{'PALM-4821':'Palm Court Residence'},code:'',invited:[],shop:null,cart:{},step:'scan',comm:'',age:'',name:'',tab:'chat',
 msgs:[{n:'Mariam',t:'Good morning all! Bakery on the ground floor has fresh bread today 🥖'},{n:'Omar',t:'Anyone going to the pharmacy this afternoon? Happy to pick things up.'},{n:'Priya Sharma',t:'Welcome to all our new neighbours! 🌸 Sweets and tea at the community hall on Friday, everyone is invited.',time:'09:40'},{n:'Carlos Silva',t:'Thank you Priya! I will bring some pão de queijo 🧀',time:'09:48'},{n:'Mr. Chen',t:'Good morning everyone. The garden looks lovely today ☀️',time:'10:02'}],
 shops:[{n:'Al Noor Grocery',d:'Vegetables, milk, essentials',w:'3 min walk',e:'🥬'},{n:'Green Cross Pharmacy',d:'Medicines & health items',w:'5 min walk',e:'💊'},{n:'Sunrise Bakery',d:'Bread, pastries',w:'1 min walk',e:'🥖'},{n:'Daily Fresh Mart',d:'Fruit, water, household',w:'7 min walk',e:'🛒'}],
 reqs:[{n:'Mr. Hassan',g:'Elderly',t:'Need 2 litres of milk and bread, please.',by:''}],
 people:[{n:'Mr. Hassan',g:'Elderly',f:'Flat 12',fam:'Hassan family',l:'Arabic, English'},{n:'Nour Hassan',g:'Young',f:'Flat 12',fam:'Hassan family',l:'Arabic, English'},{n:'Mariam',g:'Middle age',f:'Flat 8',fam:'Khalid family',l:'Arabic, English'},{n:'Omar',g:'Young',f:'Flat 8',fam:'Khalid family',l:'Arabic, English'},{n:'Mrs. Layla',g:'Elderly',f:'Flat 3',fam:'Layla household',l:'Arabic, French'},{n:'Priya Sharma',g:'Middle age',f:'Flat 5',fam:'Sharma family',l:'Hindi, English'},{n:'Arjun Sharma',g:'Young',f:'Flat 5',fam:'Sharma family',l:'Hindi, English'},{n:'Dadi Sharma',g:'Elderly',f:'Flat 5',fam:'Sharma family',l:'Hindi'},{n:'Wei Chen',g:'Middle age',f:'Flat 15',fam:'Chen family',l:'Mandarin, English'},{n:'Mei Chen',g:'Young',f:'Flat 15',fam:'Chen family',l:'Mandarin, English'},{n:'Mr. Chen',g:'Elderly',f:'Flat 15',fam:'Chen family',l:'Mandarin, Cantonese'},{n:'Ngozi Okafor',g:'Middle age',f:'Flat 18',fam:'Okafor family',l:'Igbo, English'},{n:'Chidi Okafor',g:'Young',f:'Flat 18',fam:'Okafor family',l:'English, Igbo'},{n:'Maria Santos',g:'Middle age',f:'Flat 22',fam:'Santos family',l:'Tagalog, English'},{n:'Joaquin Santos',g:'Young',f:'Flat 22',fam:'Santos family',l:'Tagalog, English'},{n:'Lola Rosa',g:'Elderly',f:'Flat 22',fam:'Santos family',l:'Tagalog'},{n:'Hans Müller',g:'Elderly',f:'Flat 9',fam:'Müller household',l:'German, English'},{n:'Giulia Rossi',g:'Middle age',f:'Flat 14',fam:'Rossi family',l:'Italian, English'},{n:'Luca Rossi',g:'Young',f:'Flat 14',fam:'Rossi family',l:'Italian, English'},{n:'Tariq Ahmed',g:'Middle age',f:'Flat 20',fam:'Ahmed family',l:'Urdu, English, Arabic'},{n:'Aisha Ahmed',g:'Young',f:'Flat 20',fam:'Ahmed family',l:'Urdu, English'},{n:'Carlos Silva',g:'Middle age',f:'Flat 25',fam:'Silva family',l:'Portuguese, Spanish, English'},{n:'Dona Ana',g:'Elderly',f:'Flat 25',fam:'Silva family',l:'Portuguese'},{n:'Yuki Tanaka',g:'Young',f:'Flat 30',fam:'Tanaka household',l:'Japanese, English'},{n:'Selam Yilma',g:'Middle age',f:'Flat 27',fam:'Yilma household',l:'Amharic, English'}]};
const SHOP_INFO={'Al Noor Grocery':{tel:'+971500000001',wa:'971500000001',items:['Milk (1 L)','Eggs (12)','Rice (1 kg)','Vegetables box']},'Green Cross Pharmacy':{tel:'+971500000002',wa:'971500000002',items:['Pain relief','Vitamins','Bandages','Prescription pick-up']},'Sunrise Bakery':{tel:'+971500000003',wa:'971500000003',items:['Bread loaf','Croissants (4)','Cake slice','Pastry box']},'Daily Fresh Mart':{tel:'+971500000004',wa:'971500000004',items:['Fruit basket','Water (6 pack)','Cleaning kit','Snacks']}};
const AV={'New':'🙂','Elderly':'👵','Middle age':'🧑','Young':'🧑‍🎓'};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;app.appendChild(d);setTimeout(()=>d.remove(),2200)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function go(s){S.step=s;render()}
function render(){
 document.body.classList.toggle('big',S.age==='Elderly');
 const v={scan,join,invite,age,sign,home}[S.step];app.innerHTML=v();bind()}
const scan=()=>`<div class="scr" style="justify-content:center;text-align:center">
 <div class="logo">Haa<i>r</i>a</div><h2>Your neighbourhood, together</h2>
 <p class="sub">Scan the QR code in your building or street to join your community.</p>
 <div class="qr"><svg viewBox="0 0 10 10" fill="currentColor" style="color:var(--teal)"><path d="M0 0h4v4H0zM6 0h4v4H6zM0 6h4v4H0zM6 6h2v2H6zM9 6h1v1H9zM8 8h2v2H8zM1 1h2v2H1zM7 1h2v2H7zM1 7h2v2H1z" fill-rule="evenodd"/></svg></div>
 <button id="sc">Scan QR code</button>
 <p class="sub" style="font-size:.85em">Demo: this simulates scanning the code for “Palm Court Residence”.</p></div>`;
const join=()=>`<div class="scr"><div class="logo">Haa<i>r</i>a</div>
 <div class="card"><span class="chip">Found by QR</span><h2 style="margin:8px 0 4px">Palm Court Residence</h2><p class="sub" style="margin:0">42 neighbours · 4 shops nearby</p></div>
 <button id="jn">Join this community</button>
 <div class="card"><label for="jc">Have an invite code?</label><input id="jc" placeholder="e.g. PALM-4821" autocapitalize="characters"><br><br><button class="alt" id="jc2" style="width:100%">Join with code</button></div><p class="sub" style="text-align:center;margin:0">or</p>
 <div class="card"><label for="nc">Create a new community</label><input id="nc" placeholder="e.g. Sunset Street"><br><br><button class="alt" id="cr" style="width:100%">Create community</button></div></div>`;
const invite=()=>`<div class="scr"><div class="logo">Haa<i>r</i>a</div><h1 style="font-size:1.8em">${esc(S.comm)} is ready</h1><p class="sub">Share this code. Anyone who enters it joins your community and can chat.</p>
<div class="card" style="text-align:center"><div class="sub">Invite code</div><div style="font:800 2.4em 'Bricolage Grotesque';letter-spacing:2px;color:var(--teal)">${S.code}</div><div class="row" style="margin-top:10px"><button id="cp" style="flex:1">Copy code</button><button class="sun" id="sh" style="flex:1">Share</button></div></div>
<div class="card"><label for="an">Send invite</label><input id="an" placeholder="Phone number or email" inputmode="email" autocapitalize="off"><br><br><button class="sun" id="ad" style="width:100%">Send invite</button></div>
<button id="go">${S.name?'Back to community':'Continue'}</button></div>`;
function copyCode(){try{navigator.clipboard.writeText(S.code).then(()=>toast('Code copied'),()=>toast('Code: '+S.code))}catch(e){toast('Code: '+S.code)}}
const age=()=>`<div class="scr"><h1 style="font-size:1.9em">Who is using Haara?</h1><p class="sub">Pick one. We will adjust the app to fit you.</p>
 <button class="age" data-a="Elderly"><span class="e">👵</span><div><b>Elderly</b><small>Bigger text, simple screens</small></div></button>
 <button class="age" data-a="Middle age"><span class="e">🧑</span><div><b>Middle age</b><small>Order, share and help</small></div></button>
 <button class="age" data-a="Young"><span class="e">🧑‍🎓</span><div><b>Young</b><small>Run errands for neighbours</small></div></button></div>`;
const sign=()=>`<div class="scr"><h1 style="font-size:1.9em">Create your account</h1><p class="sub">${S.comm} · ${S.age}</p>
 <div><label for="nm">Your name</label><input id="nm" autocomplete="name"></div>
 <div><label for="ph">Phone or email</label><input id="ph" autocomplete="username"></div>
 <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password"></div>
 ${S.creator?'':`<div><label for="pin">Admin PIN (optional)</label><input id="pin" inputmode="numeric" placeholder="Only if you manage this community"></div>`}<button id="su">Sign up and enter</button></div>`;
function home(){
 const t=S.tab;let body='';
 if(t==='chat')body=chatView();
 if(t==='shops'&&S.shop!==null)body=shopView();if(t==='shops'&&S.shop===null)body=`<div class="list">${S.shops.map((s,i)=>`<div class="card row"><div><b>${s.e} ${s.n}</b><div class="sub">${s.d} · ${s.w}</div></div><button data-o="${i}">Order</button></div>`).join('')}<p class="sub">Tap Order to ask a neighbour to get it for you.</p></div>`;
 if(t==='help')body=`<div class="list"><div class="card"><label for="rq">What do you need?</label><input id="rq" placeholder="e.g. Medicine from the pharmacy"><br><br><button class="sun" id="ar" style="width:100%">Ask neighbours for help</button></div>
 ${S.reqs.map((r,i)=>`<div class="card"><div class="row"><b>${esc(r.n)}</b><span class="chip g">${r.g}</span></div><p style="margin:6px 0">${esc(r.t)}</p>${r.by?`<span class="chip">✓ ${esc(r.by)} is helping</span>`:`<button data-h="${i}">I can help</button>`}</div>`).join('')}</div>`;
 if(t==='aislin')body=aislinView();if(t==='dm')body=dmView();if(t==='admin')body=adminView();if(t==='people')body=`<div class="list"><div class="card row"><div><b>Invite code</b><div style="font:800 1.3em 'Bricolage Grotesque'">${S.code||'PALM-4821'}</div></div><button id="iv">Invite</button></div>${S.rep?repForm():''}${famForm()}${[...S.people].sort((a,b)=>(a.fam||'~').localeCompare(b.fam||'~')).map((p,k,a)=>`${k===0||a[k-1].fam!==p.fam?`<h3 style="margin-top:6px">👨‍👩‍👧 ${esc(p.fam||'Other neighbours')}</h3>`:''}<div class="card row"><div><button data-pf="${esc(p.n)}" style="background:none;color:var(--ink);padding:0;text-align:left;font-weight:800;border-radius:6px">${AV[p.g]} ${esc(p.n)} ›</button><div class="sub">${p.f}${p.muted?' · Muted':''}</div>${p.l?'<div class="sub">🌍 '+esc(p.l)+'</div>':''}</div><span class="row" style="gap:8px"><span class="chip g">${p.g}</span>${p.n!==S.name?`<button class="alt" data-rp="${esc(p.n)}" style="padding:6px 10px;font-size:.8em">Report</button>`:''}</span></div>`).join('')}</div>`;
 const tabs=[['chat','💬','Chat'],['shops','🏪','Shops'],['help','🤝','Help'],['people','👥','People'],['aislin','🤖','Aislin']].concat(S.admin?[['admin','🛡️','Admin']]:[['dm','📩','Admin']]);
 const pc=S.pm.reqs.filter(r=>isMe(r.to)&&r.st==='pending').length;if(S.pmv)body=pmView();if(S.prof)body=profileView();if(S.gm)body=gamesView();return `<header><div><small>Haara</small><h2>${S.comm}</h2></div><span class="row" style="gap:8px"><button id="pmb" aria-label="Private messages" style="padding:6px 10px;background:rgba(255,255,255,.2)">✉️${pc?'<sup>'+pc+'</sup>':''}</button><button id="mpb" aria-label="Community map" style="padding:6px 10px;background:rgba(255,255,255,.2)">🗺️</button><button id="gmb" aria-label="Games" style="padding:6px 10px;background:rgba(255,255,255,.2)">🎮</button><span class="chip">${AV[S.age]}</span></span></header>${body}<nav>${tabs.map(([k,i,l])=>`<button data-t="${k}" class="${t===k?'on':''}"><span>${i}</span>${l}</button>`).join('')}</nav>`}
const CATS=[['General','💬'],['Need help','🆘'],['Shop deal','🏪'],['Alert','⚠️']];
const BAD=/\b(idiot|stupid|shut up|damn|hate you|fool|dumb)\b/i;

function chatView(){const pin=[...S.msgs].reverse().find(m=>m.pin);const list=S.msgs.filter(m=>!m.pin&&(S.f==='All'||m.c===S.f));

 on('#su',()=>{const n=$('#nm').value.trim();if(!n||!$('#ph').value.trim()||$('#pw').value.length<4)return toast('Fill all fields, password 4+ characters');S.name=n;if(!S.creator&&$('#pin')&&$('#pin').value.trim()==='1234')S.admin=true;S.people.push({n,g:S.age,f:S.admin?'You · Admin':'You',fam:'Your household'});S.tab=S.age==='Elderly'?'help':'chat';go('home')});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.gm=null;S.prof=null;S.pe=false;S.pmv=false;S.pm.open=null;if(S.tab==='shops')S.shop=null;render()});
 const send=()=>{const v=$('#mi').value.trim();if(!v)return;const me=S.people.find(p=>p.n===S.name);if(me&&me.muted)return toast('You are muted by the admin');if(BAD.test(v))return toast('Please keep the chat respectful. Message not sent.');if(S.msgs.slice(-3).length===3&&S.msgs.slice(-3).every(m=>m.me&&m.t===v))return toast('Please do not repeat the same message');const rq=S.rep2!=null&&S.msgs[S.rep2]?{n:S.msgs[S.rep2].n,t:S.msgs[S.rep2].t.slice(0,60)}:undefined;S.rep2=null;S.msgs.push({n:S.name,t:v,me:1,c:S.c,time:nowT(),rt:rq});if(S.c==='Need help'){S.reqs.unshift({n:S.name,g:S.age,t:v,by:''});toast('Also added to the Help board')}S.f='All';render();neighbourSay(v,S.c)};
 on('#sd',send);const mi=$('#mi');if(mi)mi.onkeydown=e=>{if(e.key==='Enter')send()};
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const d=$('#mi').value;S.f=b.dataset.f;render();$('#mi').value=d});
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const d=$('#mi').value;S.c=b.dataset.c;render();$('#mi').value=d;$('#mi').focus()});
 const ms=$('#ms');if(ms)ms.scrollTop=ms.scrollHeight;
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.shop=+b.dataset.o;S.cart={};render()});
 on('#bk',()=>{S.shop=null;render()});
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.q.split(',');S.cart[i]=Math.max(0,(S.cart[i]||0)+ +d);render()});
 on('#nb',()=>{const l=cartText();if(!l)return toast('Add at least one item');const s=S.shops[S.shop];S.reqs.unshift({n:S.name,g:S.age,t:'Please order from '+s.n+': '+l,by:''});S.tab='help';S.shop=null;render();toast('Request sent to neighbours')});
 on('#ar',()=>{const v=$('#rq').value.trim();if(!v)return toast('Write what you need');S.reqs.unshift({n:S.name,g:S.age,t:v,by:''});S.msgs.push({n:S.name,t:'🙋 Help needed: '+v,me:1});render();toast('Neighbours notified')});
 document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.reqs[b.dataset.h].by=S.name;S.hc[S.name]=(S.hc[S.name]||0)+1;render();toast('Thank you for helping!')});
}
render();
</script></body></html>
